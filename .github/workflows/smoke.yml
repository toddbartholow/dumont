name: Smoke test

# Builds the release binary and drives it through tauri-driver (e2e/smoke.mjs):
# open a file from the command line, edit and save it, close with unsaved
# changes, relaunch and restore. CI's unit tests mock every Tauri call, so this
# is the one check that runs the real commands in the real webview.
#
# Not run on every pull request: it builds the app from scratch and takes
# several minutes. Run it by hand (Actions tab -> Smoke test -> Run workflow);
# Release calls it before anything is bumped or published.
#
# The driven test is Linux only, on 22.04, the image Release bundles on.
# tauri-driver cannot drive Dumont on Windows: msedgedriver attaches through
# WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, and WebView2 ignores that variable when
# the app passes its own browser arguments, which wry always does. It also hands
# `args` to the browser rather than the app, and gives each session a fresh data
# folder, so the argv and restore checks could not run there anyway. Windows
# gets the launch-windows job instead: start the binary, see the window come up,
# close it.
on:
  workflow_dispatch:
  workflow_call:
  # Also on a PR that changes the smoke test itself, so it is proven before it
  # lands rather than at the next release.
  pull_request:
    branches:
      - main
    paths:
      - 'e2e/**'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          # A release build, unlike CI's debug one, so keep its cache apart.
          key: smoke

      - name: Install Linux dependencies
        # webkit2gtk-driver provides WebKitWebDriver, which tauri-driver drives.
        # The app needs a display (xvfb) and a session bus (dbus-run-session),
        # which the single-instance plugin registers on.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        # --no-bundle: the smoke test runs the binary, so skip the installers and
        # the updater artifacts, which would need the signing key.
        run: bun tauri build --no-bundle

      - name: Install the smoke test
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Run the smoke test
        working-directory: e2e
        # A fresh config and data directory, so the run starts with no settings
        # and no saved session, as a new install would.
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/smoke/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/smoke/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/smoke/cache"
          export SMOKE_ARTIFACTS="$RUNNER_TEMP/smoke/failures"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a dbus-run-session -- node smoke.mjs ../src-tauri/target/release/dumont

      - name: Upload what the failing step saw
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-failure
          path: ${{ runner.temp }}/smoke/failures
          if-no-files-found: ignore

  # Windows cannot run the driven test (see the top of this file), so check the
  # release binary starts: its WebView2 comes up, the window becomes visible, and
  # it closes cleanly. The window is created hidden and only shown once React
  # has mounted, so a visible window also catches a build that can never show
  # itself, which has shipped before (show/set-focus missing from capabilities).
  launch-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'
          key: smoke

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        run: bun tauri build --no-bundle

      - name: Launch, show the window, close
        shell: pwsh
        run: |
          $app = (Resolve-Path src-tauri\target\release\dumont.exe).Path
          $p = Start-Process -FilePath $app -PassThru

          # The window starts hidden; wait for the app to show it.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 1
            $p.Refresh()
          } until ($p.HasExited -or $p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
          if ($p.HasExited) { throw "dumont exited during startup, code $($p.ExitCode)" }
          if ($p.MainWindowHandle -eq 0) { throw "dumont is running but never showed its window" }
          "Window shown: '$($p.MainWindowTitle)'"

          $webview = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Where-Object { $_.CommandLine -match 'webview-exe-name=dumont\.exe' }
          if (-not $webview) { throw "no WebView2 process belongs to dumont" }

          # Still up a little later: a crash just after the first paint shows here.
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "dumont exited after showing its window, code $($p.ExitCode)" }

          # WM_CLOSE goes through the same close-requested path as the title bar
          # X. With nothing unsaved the app should quit, not ask.
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force
            throw "dumont did not quit on close"
          }
          "Closed cleanly, exit code $($p.ExitCode)"
